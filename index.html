<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0f14">
<title>Tournament Grid</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --bg:#0e0f14;--panel:#151722;--panel2:#1b1e2b;--card:#1f2230;
  --line:#2a2e40;--wire:#3a4160;--txt:#e6e8f0;--dim:#8b90a6;--acc:#7b61ff;
  --ok:#3ddc97;--bad:#ff5f6d;--gap:56px;--col:224px;--unit:34px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-text-size-adjust:100%}
.app{display:flex;min-height:100vh}

/* ---- left rail ---- */
.rail{width:80px;flex:0 0 80px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  position:sticky;top:0;height:100vh}
.rail button{width:54px;height:54px;border:0;border-radius:16px;background:transparent;color:var(--dim);
  cursor:pointer;display:grid;place-items:center;padding:0}
.rail button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{background:var(--panel2);color:var(--txt)}
.rail button.on{background:var(--acc);color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:20px 24px 0}
h1{font-size:21px;margin:0 0 4px}
h3{margin:0 0 10px;font-size:15px}
.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:18px;padding:14px 24px 0;border-bottom:1px solid var(--line);background:var(--panel);margin-top:14px;overflow-x:auto}
.tabs a{padding:0 2px 10px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;white-space:nowrap}
.tabs a.on{color:var(--txt);border-color:var(--acc)}
.body{padding:22px 24px 70px}

.btn{background:var(--acc);border:0;color:#fff;padding:10px 15px;border-radius:9px;cursor:pointer;font-size:13px}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.danger{color:var(--bad)}
.btn:hover{filter:brightness(1.12)}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:10px 11px;font:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:16px 0 7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form{max-width:640px}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.tcard:hover{border-color:var(--acc)}
.tcard h3{margin:0 0 4px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--dim);padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#fff}
.teams{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.trow input{background:transparent;border:0;padding:4px 2px;border-radius:0}
.trow input:focus{outline:none;border:0;box-shadow:none}
.trow .ti{flex:0 0 150px;color:var(--dim);font-size:12px}
.trow .x{background:transparent;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:4px 6px}
.trow .x:hover{color:var(--bad)}
.seedno{color:#5d6478;font-size:11px;width:16px;text-align:right;flex:0 0 16px}
.hint{color:#6d7492;font-size:12px;margin-top:18px;max-width:760px}
.sec{margin:26px 0 12px;color:var(--dim);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.sec:first-child{margin-top:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--dim);font-weight:500}
.empty{color:var(--dim);padding:20px 0}
.scroll{overflow-x:auto;padding-bottom:10px}

/* ---- bracket (CSS grid) ---- */
.grid-br{display:grid;grid-template-columns:repeat(var(--cols),var(--col));grid-auto-rows:var(--unit);
  column-gap:var(--gap);min-width:max-content}
.rhead{grid-row:1;align-self:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  text-align:center;padding:6px 8px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{display:flex;align-items:center;position:relative}
.cell.out-r::after{content:"";position:absolute;left:100%;top:50%;width:calc(var(--gap) / 2);border-top:1px solid var(--wire)}
.cell.in-l::before{content:"";position:absolute;right:100%;top:50%;width:calc(var(--gap) / 2);border-top:1px solid var(--wire)}
.cell .v{position:absolute;left:calc(100% + var(--gap) / 2);top:50%;height:100%;border-left:1px solid var(--wire)}
.match{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;width:100%}
.slot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);min-height:31px}
.slot:last-child{border-bottom:0}
.slot.win{box-shadow:inset 3px 0 0 var(--ok)}
.slot.lose{box-shadow:inset 3px 0 0 var(--bad)}
.slot.win .nm{color:#fff;font-weight:600}
.slot.lose .nm{color:var(--dim)}
.nmw{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.nmw.pick{cursor:pointer}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.slot.free .nm{color:#5a6079}
.ic{width:20px;height:20px;flex:0 0 20px;border-radius:5px;display:grid;place-items:center;
  background:var(--panel2);font-size:10px;color:var(--dim);object-fit:cover;overflow:hidden}
.sc{width:24px;flex:0 0 24px;text-align:center;background:transparent;border:0;outline:none;
  color:var(--dim);font:inherit;padding:0;border-radius:0}
.sc:focus{outline:none;border:0}
.slot.win .sc{color:#fff;font-weight:700}
.mark{font-size:11px;line-height:1}
.mark.d{color:var(--bad)}
.mark.o{color:#5a6079}
.mark.u{color:var(--ok)}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(6,7,11,.72);display:grid;place-items:center;padding:18px;z-index:20}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(430px,100%);max-height:82vh;overflow:auto}
.plist{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px}
.pitem{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:9px;padding:8px 10px;cursor:pointer;font:inherit;text-align:left}
.pitem:hover{border-color:var(--acc)}
.pitem em{margin-left:auto;color:var(--dim);font-style:normal;font-size:11px}

@media(max-width:700px){
  :root{--gap:40px;--col:196px}
  .rail{width:64px;flex-basis:64px;gap:8px}
  .rail button{width:46px;height:46px;border-radius:14px}
  .rail button svg{width:23px;height:23px}
  .body,.top{padding-left:14px;padding-right:14px}
  .tabs{padding-left:14px;padding-right:14px}
  .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <button data-nav="home" title="Турниры"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9.5h18M9 9.5V20"/></svg></button>
    <button data-nav="new" title="Создать турнир"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-nav="participants" title="Команды"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.2 2.8-5.2 6-5.2s6 2 6 5.2"/><path d="M16.5 5.6a3.2 3.2 0 010 5.6M18 14.6c2 .7 3.4 2.4 3.4 4.6"/></svg></button>
    <button data-nav="bracket" title="Сетка"><svg viewBox="0 0 24 24"><path d="M3 6h5v5H3zM3 13h5v5H3zM16 9h5v6h-5z"/><path d="M8 8.5h3v8h3M11 8.5v8"/></svg></button>
    <button data-nav="standings" title="Таблица"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 10h18M9 10v10"/></svg></button>
    <button data-nav="log" title="Лог"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.3l3.3 2"/></svg></button>
    <button data-nav="export" title="Экспорт / импорт"><svg viewBox="0 0 24 24"><path d="M4 9h13M13.5 5.5 17 9l-3.5 3.5M20 15H7M10.5 11.5 7 15l3.5 3.5"/></svg></button>
  </aside>
  <div class="main">
    <div class="top" id="top"></div>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="view"></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
var KEY='bracket.v2';
function loadDb(){try{return JSON.parse(localStorage.getItem(KEY))||{list:[]}}catch(e){return{list:[]}}}
var db=loadDb();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
var S={view:'home',id:null};
var draft=null;
function cur(){for(var i=0;i<db.list.length;i++){if(db.list[i].id===S.id)return db.list[i]}return null}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function initials(n){var p=String(n||'').trim().split(/\s+/);var s=((p[0]||'').charAt(0)+(p[1]?p[1].charAt(0):''));return s.toUpperCase()||'?'}
function iconHTML(t){
  if(!t)return '<span class="ic"></span>';
  var ic=String(t.icon||'').trim();
  if(/^(https?:\/\/|data:image)/i.test(ic))return '<img class="ic" src="'+esc(ic)+'" alt="">';
  if(ic)return '<span class="ic">'+esc(ic.slice(0,2))+'</span>';
  return '<span class="ic">'+esc(initials(t.name))+'</span>';
}
function pow2up(x){var s=2;while(s<x)s*=2;return s}
function addLog(t,msg){t.log=t.log||[];t.log.push({at:new Date().toLocaleString(),msg:msg});if(t.log.length>200)t.log.shift()}

/* ================= bracket model ================= */
function seedOrder(n){var a=[0];for(var s=1;s<n;s*=2){var b=[];for(var i=0;i<a.length;i++){b.push(a[i]);b.push(s*2-1-a[i])}a=b}return a}
function build(t){
  var size=t.size||4,n=Math.round(Math.log(size)/Math.LN2),W=[],L=[],all=[],i,r,k,gf=null;
  function mk(br,rd,ix,a,b){var m={id:br+rd+'-'+ix,bracket:br,round:rd,idx:ix,a:a,b:b};all.push(m);return m}
  var ord=seedOrder(size);
  W[0]=[];for(i=0;i<size/2;i++)W[0].push(mk('W',0,i,{seed:ord[i*2]},{seed:ord[i*2+1]}));
  for(r=1;r<n;r++){W[r]=[];for(i=0;i<size/Math.pow(2,r+1);i++)W[r].push(mk('W',r,i,{w:W[r-1][i*2].id},{w:W[r-1][i*2+1].id}))}
  if(t.format==='double'&&size>=4){
    var li=0,L0=[];
    for(i=0;i<size/4;i++)L0.push(mk('L',li,i,{l:W[0][i*2].id},{l:W[0][i*2+1].id}));
    L.push(L0);li++;
    for(k=1;k<n;k++){
      var prev=L[L.length-1];
      if(k>1){var mn=[];for(i=0;i<prev.length/2;i++)mn.push(mk('L',li,i,{w:prev[i*2].id},{w:prev[i*2+1].id}));L.push(mn);li++}
      var src=L[L.length-1],mj=[];
      for(i=0;i<W[k].length;i++)mj.push(mk('L',li,i,{w:src[i].id},{l:W[k][i].id}));
      L.push(mj);li++;
    }
    gf=mk('GF',0,0,{w:W[n-1][0].id},{w:L[L.length-1][0].id});
  }
  return {size:size,n:n,W:W,L:L,gf:gf,all:all};
}
function solve(t){
  var B=build(t),out={},res=t.results||{},map={},i;
  for(i=0;i<t.teams.length;i++)map[t.teams[i].id]=t.teams[i];
  function val(s){
    if(!s)return null;
    if('seed' in s){var id=t.seeds[s.seed];return id?(map[id]||null):null}
    if(s.w)return out[s.w]?out[s.w].winner:null;
    return out[s.l]?out[s.l].loser:null;
  }
  for(i=0;i<B.all.length;i++){
    var m=B.all[i],a=val(m.a),b=val(m.b),r=res[m.id]||{};
    m.ta=a;m.tb=b;m.sa=r.sa==null?0:r.sa;m.sb=r.sb==null?0:r.sb;
    var w=null,l=null;
    if(a&&b&&m.sa!==m.sb){if(m.sa>m.sb){w=a;l=b}else{w=b;l=a}}
    out[m.id]={winner:w,loser:l};m.winner=w;m.loser=l;
  }
  B.map=map;return B;
}

/* ================= match rendering ================= */
function slotHTML(m,side){
  var team=side==='a'?m.ta:m.tb,sc=side==='a'?m.sa:m.sb,src=side==='a'?m.a:m.b;
  var seed=(src&&'seed' in src&&src.seed!=null)?src.seed:null;
  var st='';
  if(m.winner){st=(team&&team===m.winner)?'win':(team?'lose':'')}
  var mark='';
  if(st==='lose')mark=m.bracket==='W'?'<span class="mark d">↓</span>':'<span class="mark o">✕</span>';
  if(st==='win'&&m.bracket==='L')mark='<span class="mark u">↑</span>';
  var label=team?esc(team.name):(seed!=null?'Свободно':'TBD');
  return '<div class="slot '+st+(team?'':' free')+'">'+
    '<span class="nmw'+(seed!=null?' pick" data-seed="'+seed+'"':'"')+'>'+iconHTML(team)+'<span class="nm">'+label+'</span></span>'+
    mark+'<input class="sc" data-m="'+m.id+'" data-s="'+side+'" value="'+sc+'" inputmode="numeric"></div>';
}
function matchHTML(m){return '<div class="match">'+slotHTML(m,'a')+slotHTML(m,'b')+'</div>'}
function gridHTML(rounds,labels){
  var totalRows=rounds[0].length*2,h='<div class="scroll"><div class="grid-br" style="--cols:'+rounds.length+'">',r,i;
  for(r=0;r<rounds.length;r++){
    var cnt=rounds[r].length,span=totalRows/cnt,next=rounds[r+1];
    h+='<div class="rhead" style="grid-column:'+(r+1)+'">'+esc(labels[r])+'</div>';
    for(i=0;i<cnt;i++){
      var pairs=!!next&&next.length!==cnt,cls='cell';
      if(next)cls+=' out-r';
      if(r>0)cls+=' in-l';
      h+='<div class="'+cls+'" style="grid-column:'+(r+1)+';grid-row:'+(2+i*span)+' / span '+span+'">'+
        matchHTML(rounds[r][i])+(pairs&&i%2===0?'<i class="v"></i>':'')+'</div>';
    }
  }
  return h+'</div></div>';
}
function wLabels(t,B){
  var out=[],n=B.W.length,r;
  for(r=0;r<n;r++){
    var cnt=B.W[r].length;
    if(t.format==='double')out.push(r===n-1?'Upper Final':'Upper Bracket R'+(r+1));
    else out.push(cnt===1?'Final':cnt===2?'Semi-finals':cnt===4?'Quarter-finals':'Round '+(r+1));
  }
  return out;
}
function bracketHTML(t,B){
  var wr=B.W.slice(),wl=wLabels(t,B),r;
  if(B.gf){wr.push([B.gf]);wl.push('Grand Final')}
  var h='<div class="sec">Upper Bracket · Bo'+t.bo+'</div>'+gridHTML(wr,wl);
  if(B.L.length){
    var ll=[];for(r=0;r<B.L.length;r++)ll.push(r===B.L.length-1?'Lower Final':'Lower Bracket R'+(r+1));
    h+='<div class="sec">Lower Bracket</div>'+gridHTML(B.L,ll);
  }
  return h+'<div class="hint">Свободные слоты первого раунда кликабельны — выберите команду или оставьте место пустым. Счёт начинается с 0:0, победитель отмечается зелёной полосой слева и идёт дальше, проигравший — красной; ↓ = переход в нижнюю сетку, ✕ = вылет.</div>';
}

/* ================= views ================= */
var TABS=[['overview','Overview'],['participants','Teams'],['bracket','Final Stage'],['matches','Matches'],['standings','Standings'],['log','Log']];
function segHTML(k,vals,cur){
  var h='<div class="seg" data-seg="'+k+'">',i;
  for(i=0;i<vals.length;i++){
    var v=vals[i],val=(v instanceof Array)?v[0]:v,lab=(v instanceof Array)?v[1]:v;
    h+='<button data-v="'+esc(val)+'" class="'+(String(val)===String(cur)?'on':'')+'">'+esc(lab)+'</button>';
  }
  return h+'</div>';
}
function teamRowsHTML(teams,seeded){
  var h='<div class="teams">',i;
  for(i=0;i<teams.length;i++){
    h+='<div class="trow" data-i="'+i+'"><span class="seedno">'+(i+1)+'</span>'+iconHTML(teams[i])+
      '<input class="ti" data-f="icon" data-i="'+i+'" value="'+esc(teams[i].icon||'')+'" placeholder="эмодзи / URL логотипа">'+
      '<input class="tn" data-f="name" data-i="'+i+'" value="'+esc(teams[i].name||'')+'" placeholder="Название команды">'+
      '<button class="x" data-act="delTeam" data-i="'+i+'">✕</button></div>';
  }
  if(!teams.length)h+='<div class="empty">Команд пока нет.</div>';
  return h+'</div>';
}
function homeHTML(){
  var h='<div class="row" style="margin-bottom:16px"><button class="btn" data-act="new">Создать турнир</button></div>';
  if(!db.list.length)return h+'<div class="empty">Турниров пока нет.</div>';
  h+='<div class="grid">';
  for(var i=0;i<db.list.length;i++){var t=db.list[i];
    h+='<div class="tcard" data-open="'+t.id+'"><h3>'+esc(t.name)+'</h3><div class="sub">'+esc(t.date||'')+
      (t.date?' · ':'')+(t.format==='double'?'Double':'Single')+' · Bo'+t.bo+' · '+t.teams.length+'/'+t.size+' команд</div></div>';}
  return h+'</div>';
}
function formHTML(){
  return '<div class="form"><div class="fgrid">'+
    '<div><label style="margin-top:0">Название турнира</label><input id="f-name" value="'+esc(draft.name)+'" placeholder="Spring Championship"></div>'+
    '<div><label style="margin-top:0">Дата / раунд</label><input id="f-date" value="'+esc(draft.date)+'" placeholder="April 2026"></div></div>'+
    '<label>Формат</label>'+segHTML('format',[['single','Single Elimination'],['double','Double Elimination']],draft.format)+
    '<label>Матчи до</label>'+segHTML('bo',[[1,'Bo1'],[3,'Bo3'],[5,'Bo5']],draft.bo)+
    '<label>Размер сетки (свободные места можно заполнить позже)</label>'+segHTML('size',[4,8,16,32],draft.size)+
    '<label>Команды — иконка и название</label>'+teamRowsHTML(draft.teams)+
    '<div class="row" style="margin-top:10px"><button class="btn ghost" data-act="addTeam">+ Команда</button>'+
    '<button class="btn ghost" data-act="bulk">Вставить списком</button></div>'+
    '<div class="row" style="margin-top:20px"><button class="btn" data-act="create">Создать турнир</button>'+
    '<button class="btn ghost" data-act="home">Отмена</button></div>'+
    '<div class="hint">Иконка команды: эмодзи (🛡, 🐺) или прямая ссылка на логотип. Она показывается в каждой карточке матча.</div></div>';
}
function ioHTML(){
  return '<div class="form"><label style="margin-top:0">JSON всех турниров — бэкап или передача сетки</label>'+
    '<textarea id="io" rows="12">'+esc(JSON.stringify(db,null,2))+'</textarea>'+
    '<div class="row" style="margin-top:14px"><button class="btn" data-act="import">Импортировать</button>'+
    '<button class="btn ghost" data-act="home">Назад</button></div></div>';
}
function participantsHTML(t){
  return '<div class="form"><label style="margin-top:0">Команды</label>'+teamRowsHTML(t.teams)+
    '<div class="row" style="margin-top:10px"><button class="btn ghost" data-act="addTeam">+ Команда</button>'+
    '<button class="btn ghost" data-act="bulk">Вставить списком</button>'+
    '<button class="btn ghost" data-act="fill">Заполнить свободные места</button>'+
    '<button class="btn ghost" data-act="shuffle">Перемешать посев</button></div>'+
    '<label>Размер сетки</label>'+segHTML('size',[4,8,16,32],t.size)+
    '<label>Формат</label>'+segHTML('format',[['single','Single'],['double','Double']],t.format)+
    '<label>Матчи до</label>'+segHTML('bo',[[1,'Bo1'],[3,'Bo3'],[5,'Bo5']],t.bo)+
    '<div class="row" style="margin-top:20px"><button class="btn ghost" data-act="reset">Сбросить результаты</button>'+
    '<button class="btn ghost danger" data-act="del">Удалить турнир</button></div></div>';
}
function overviewHTML(t,B){
  var played=0,i;
  for(i=0;i<B.all.length;i++)if(B.all[i].winner)played++;
  var champ=B.gf?B.gf.winner:B.W[B.W.length-1][0].winner;
  var free=0;
  for(i=0;i<t.seeds.length;i++)if(!t.seeds[i])free++;
  return '<div class="grid"><div class="tcard"><h3>Чемпион</h3><div class="sub">'+(champ?esc(champ.name):'ещё не определён')+'</div></div>'+
    '<div class="tcard"><h3>Матчей сыграно</h3><div class="sub">'+played+' из '+B.all.length+'</div></div>'+
    '<div class="tcard"><h3>Свободных мест</h3><div class="sub">'+free+' из '+t.size+'</div></div></div>'+
    '<div class="hint">Данные турнира хранятся в вашем браузере (localStorage). Вкладка «⇄» позволяет выгрузить JSON и передать сетку другому человеку.</div>';
}
function matchesHTML(t,B){
  var h='<div class="scroll"><table><tr><th>#</th><th>Стадия</th><th>Матч</th><th>Счёт</th></tr>',i;
  for(i=0;i<B.all.length;i++){var m=B.all[i];
    h+='<tr><td>'+(i+1)+'</td><td>'+(m.bracket==='GF'?'Grand Final':m.bracket+(m.round+1))+'</td><td>'+
      esc(m.ta?m.ta.name:'—')+' — '+esc(m.tb?m.tb.name:'—')+'</td><td>'+m.sa+':'+m.sb+'</td></tr>';}
  return h+'</table></div>';
}
function standingsHTML(t,B){
  var st={},i;
  for(i=0;i<t.teams.length;i++)st[t.teams[i].id]={t:t.teams[i],w:0,l:0};
  for(i=0;i<B.all.length;i++){var m=B.all[i];
    if(m.winner&&m.loser){if(st[m.winner.id])st[m.winner.id].w++;if(st[m.loser.id])st[m.loser.id].l++}}
  var rows=[];for(var k in st)rows.push(st[k]);
  rows.sort(function(a,b){return b.w-a.w||a.l-b.l});
  var h='<table><tr><th>#</th><th>Команда</th><th>W</th><th>L</th></tr>';
  for(i=0;i<rows.length;i++)h+='<tr><td>'+(i+1)+'</td><td><span class="nmw">'+iconHTML(rows[i].t)+'<span class="nm">'+
    esc(rows[i].t.name)+'</span></span></td><td>'+rows[i].w+'</td><td>'+rows[i].l+'</td></tr>';
  return h+'</table>';
}
function logHTML(t){
  var l=(t.log||[]).slice().reverse(),i;
  if(!l.length)return '<div class="empty">Пока пусто.</div>';
  var h='<table><tr><th>Время</th><th>Событие</th></tr>';
  for(i=0;i<l.length;i++)h+='<tr><td>'+esc(l[i].at)+'</td><td>'+esc(l[i].msg)+'</td></tr>';
  return h+'</table>';
}
function render(){
  var t=cur(),rail=document.querySelectorAll('.rail button'),i;
  for(i=0;i<rail.length;i++)rail[i].className=(rail[i].getAttribute('data-nav')===S.view?'on':'');
  var top=document.getElementById('top'),tabs=document.getElementById('tabs'),v=document.getElementById('view');
  if(!t||S.view==='home'||S.view==='new'||S.view==='export'){
    top.innerHTML='<h1>'+(S.view==='new'?'Новый турнир':S.view==='export'?'Экспорт / импорт':'Мои турниры')+
      '</h1><div class="sub">Всё хранится в вашем браузере — сервер не нужен</div>';
    tabs.innerHTML='';
    v.innerHTML=S.view==='new'?formHTML():S.view==='export'?ioHTML():homeHTML();
    return;
  }
  top.innerHTML='<h1>'+esc(t.name)+'</h1><div class="sub">'+esc(t.date||'')+(t.date?' · ':'')+
    (t.format==='double'?'Double':'Single')+' Elimination · Bo'+t.bo+' · '+t.teams.length+' команд / '+t.size+' мест</div>';
  var h='';
  for(i=0;i<TABS.length;i++)h+='<a data-tab="'+TABS[i][0]+'" class="'+(S.view===TABS[i][0]?'on':'')+'">'+TABS[i][1]+'</a>';
  tabs.innerHTML=h;
  var B=solve(t);
  v.innerHTML=S.view==='overview'?overviewHTML(t,B):S.view==='participants'?participantsHTML(t):
    S.view==='matches'?matchesHTML(t,B):S.view==='standings'?standingsHTML(t,B):
    S.view==='log'?logHTML(t):bracketHTML(t,B);
}

/* ================= modal ================= */
function openModal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').hidden=false}
function closeModal(){document.getElementById('modal').hidden=true}
function openPicker(seed){
  var t=cur();if(!t)return;
  var used={},i;
  for(i=0;i<t.seeds.length;i++)if(t.seeds[i])used[t.seeds[i]]=i;
  var h='<h3>Команда на место #'+(seed+1)+'</h3><div class="plist">';
  for(i=0;i<t.teams.length;i++){
    var tm=t.teams[i],u=(used[tm.id]!=null&&used[tm.id]!==seed);
    h+='<button class="pitem" data-act="pick" data-team="'+tm.id+'" data-slot="'+seed+'">'+iconHTML(tm)+
      '<span>'+esc(tm.name)+'</span>'+(u?'<em>сейчас на #'+(used[tm.id]+1)+'</em>':'')+'</button>';
  }
  if(!t.teams.length)h+='<div class="empty">Сначала добавьте команды.</div>';
  h+='</div><label style="margin-top:0">Новая команда</label><div class="row">'+
    '<input id="pk-icon" placeholder="🛡" style="flex:0 0 74px"><input id="pk-name" placeholder="Название" style="flex:1">'+
    '<button class="btn" data-act="pkAdd" data-slot="'+seed+'">Добавить</button></div>'+
    '<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="clearSlot" data-slot="'+seed+'">Освободить место</button>'+
    '<button class="btn ghost" data-act="closeModal">Закрыть</button></div>';
  openModal(h);
}
function openBulk(){
  openModal('<h3>Список команд</h3><div class="sub">По одной в строке. Можно указать иконку через «|»: <code>Gambit | 🛡</code></div>'+
    '<textarea id="bulk" rows="9" style="margin-top:10px"></textarea>'+
    '<div class="row" style="margin-top:14px"><button class="btn" data-act="bulkAdd">Добавить</button>'+
    '<button class="btn ghost" data-act="closeModal">Отмена</button></div>');
}
function teamsTarget(){return S.view==='new'?draft.teams:(cur()?cur().teams:null)}

/* ================= events ================= */
document.addEventListener('click',function(e){
  var el=e.target,seg=el.closest?el.closest('.seg button'):null,
      nav=el.closest?el.closest('[data-nav]'):null,tab=el.closest?el.closest('[data-tab]'):null,
      open=el.closest?el.closest('[data-open]'):null,act=el.closest?el.closest('[data-act]'):null,
      pick=el.closest?el.closest('.nmw.pick'):null;
  if(el.id==='modal'){closeModal();return}
  if(seg){
    var k=seg.parentNode.getAttribute('data-seg'),v=seg.getAttribute('data-v');
    if(S.view==='new'){draft[k]=(k==='bo'||k==='size')?+v:v}
    else{var t0=cur();if(!t0)return;
      t0[k]=(k==='bo'||k==='size')?+v:v;
      if(k==='size'||k==='format'){
        t0.seeds=t0.seeds.slice(0,t0.size);
        while(t0.seeds.length<t0.size)t0.seeds.push(null);
        t0.results={};addLog(t0,'Сетка перестроена: '+(t0.format==='double'?'Double':'Single')+', '+t0.size+' мест');
      }
      save();}
    render();return;
  }
  if(nav){var n=nav.getAttribute('data-nav');
    if(n==='new'){draft={name:'',date:'',format:'double',bo:3,size:8,teams:[{name:'',icon:''},{name:'',icon:''},{name:'',icon:''},{name:'',icon:''}]};S.view='new'}
    else S.view=(n==='home'||n==='export')?n:(S.id?n:'home');
    render();return;}
  if(tab){S.view=tab.getAttribute('data-tab');render();return}
  if(open){S.id=open.getAttribute('data-open');S.view='bracket';render();return}
  if(pick&&!act){openPicker(+pick.getAttribute('data-seed'));return}
  if(!act)return;
  var a=act.getAttribute('data-act'),t=cur(),i;
  if(a==='closeModal'){closeModal();return}
  if(a==='new'){draft={name:'',date:'',format:'double',bo:3,size:8,teams:[{name:'',icon:''},{name:'',icon:''},{name:'',icon:''},{name:'',icon:''}]};S.view='new';render();return}
  if(a==='home'){S.view='home';render();return}
  if(a==='addTeam'){var arr=teamsTarget();if(!arr)return;arr.push({name:'',icon:'',id:S.view==='new'?undefined:uid()});if(t)save();render();return}
  if(a==='delTeam'){var arr2=teamsTarget();if(!arr2)return;var idx=+act.getAttribute('data-i'),rm=arr2.splice(idx,1)[0];
    if(t&&rm&&rm.id){for(i=0;i<t.seeds.length;i++)if(t.seeds[i]===rm.id)t.seeds[i]=null;save()}
    render();return}
  if(a==='bulk'){openBulk();return}
  if(a==='bulkAdd'){
    var txt=document.getElementById('bulk').value.split('\n'),arr3=teamsTarget();
    for(i=0;i<txt.length;i++){var line=txt[i].trim();if(!line)continue;
      var parts=line.split('|'),nm=parts[0].trim(),ic=(parts[1]||'').trim();
      if(nm)arr3.push({name:nm,icon:ic,id:S.view==='new'?undefined:uid()});}
    if(t){save()}
    closeModal();render();return;
  }
  if(a==='create'){
    var teams=[],src=draft.teams;
    for(i=0;i<src.length;i++){var nm2=(src[i].name||'').trim();if(nm2)teams.push({id:uid(),name:nm2,icon:(src[i].icon||'').trim()})}
    if(teams.length<2){alert('Нужно минимум 2 команды');return}
    var size=Math.max(draft.size,pow2up(teams.length)),seeds=[];
    for(i=0;i<size;i++)seeds.push(i<teams.length?teams[i].id:null);
    var nt={id:uid(),name:draft.name.trim()||'Турнир',date:draft.date.trim(),format:draft.format,bo:draft.bo,
      size:size,teams:teams,seeds:seeds,results:{},log:[]};
    addLog(nt,'Турнир создан: '+teams.length+' команд, '+size+' мест');
    db.list.push(nt);save();S.id=nt.id;S.view='bracket';render();return;
  }
  if(a==='import'){
    try{var d=JSON.parse(document.getElementById('io').value);if(!d.list)throw 0;db=d;save();S.view='home';render()}
    catch(err){alert('Некорректный JSON')}
    return;
  }
  if(!t)return;
  if(a==='pick'){
    var id=act.getAttribute('data-team'),slot=+act.getAttribute('data-slot'),old=-1;
    for(i=0;i<t.seeds.length;i++)if(t.seeds[i]===id)old=i;
    var prev=t.seeds[slot]||null;
    t.seeds[slot]=id;
    if(old>=0&&old!==slot)t.seeds[old]=prev;
    addLog(t,'Посев обновлён');save();closeModal();render();return;
  }
  if(a==='clearSlot'){t.seeds[+act.getAttribute('data-slot')]=null;save();closeModal();render();return}
  if(a==='pkAdd'){
    var nm3=document.getElementById('pk-name').value.trim();if(!nm3){closeModal();return}
    var team={id:uid(),name:nm3,icon:document.getElementById('pk-icon').value.trim()};
    t.teams.push(team);t.seeds[+act.getAttribute('data-slot')]=team.id;
    addLog(t,'Команда добавлена: '+nm3);save();closeModal();render();return;
  }
  if(a==='fill'){
    var free=[],un=[];
    for(i=0;i<t.seeds.length;i++)if(!t.seeds[i])free.push(i);
    for(i=0;i<t.teams.length;i++){var placed=false;
      for(var j=0;j<t.seeds.length;j++)if(t.seeds[j]===t.teams[i].id)placed=true;
      if(!placed)un.push(t.teams[i].id)}
    for(i=0;i<free.length&&i<un.length;i++)t.seeds[free[i]]=un[i];
    addLog(t,'Свободные места заполнены');save();render();return;
  }
  if(a==='shuffle'){
    var ids=t.seeds.filter(function(x){return !!x});
    for(i=ids.length-1;i>0;i--){var j2=Math.floor(Math.random()*(i+1)),tmp=ids[i];ids[i]=ids[j2];ids[j2]=tmp}
    for(i=0;i<t.seeds.length;i++)t.seeds[i]=i<ids.length?ids[i]:null;
    t.results={};addLog(t,'Посев перемешан');save();render();return;
  }
  if(a==='reset'){if(confirm('Сбросить все результаты?')){t.results={};addLog(t,'Результаты сброшены');save();render()}return}
  if(a==='del'){if(confirm('Удалить турнир «'+t.name+'»?')){db.list=db.list.filter(function(x){return x.id!==t.id});save();S.id=null;S.view='home';render()}return}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='f-name'){draft.name=el.value;return}
  if(el.id==='f-date'){draft.date=el.value;return}
  var row=el.closest?el.closest('.trow'):null;
  if(row&&el.getAttribute('data-f')){
    var arr=teamsTarget();if(!arr)return;
    var i=+el.getAttribute('data-i'),f=el.getAttribute('data-f');
    arr[i][f]=el.value;
    if(f==='icon'){var ic=row.querySelector('.ic');if(ic){var tmp=document.createElement('div');tmp.innerHTML=iconHTML(arr[i]);row.replaceChild(tmp.firstChild,ic)}}
    if(S.view!=='new')save();
    return;
  }
  var sc=el.closest?el.closest('.sc'):null;
  if(sc){
    var t=cur();if(!t)return;
    var id=sc.getAttribute('data-m'),side=sc.getAttribute('data-s');
    t.results=t.results||{};t.results[id]=t.results[id]||{};
    t.results[id][side==='a'?'sa':'sb']=Math.max(0,parseInt(sc.value,10)||0);
    save();render();
    var again=document.querySelector('.sc[data-m="'+id+'"][data-s="'+side+'"]');
    if(again){again.focus();try{again.setSelectionRange(again.value.length,again.value.length)}catch(err){}}
  }
});
document.addEventListener('focusin',function(e){if(e.target.classList&&e.target.classList.contains('sc'))e.target.select()});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js')['catch'](function(){})})}
render();
</script>
</body>
