<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tournament Grid</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --bg:#000000;--panel:#070709;--panel2:#101116;--card:#131419;--soft:#191b21;
  --line:#25272f;--wire:#3b3f4c;
  --txt:#ffffff;--dim:#9aa1b3;--mute:#5f6577;
  --acc:#ffffff;--ink:#000000;
  --ok:#2ee88a;--bad:#ff4d61;--sky:#4cd6ff;--gold:#ffd166;--orange:#ff9a5a;
  --gap:76px;--col:232px;--unit:38px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{display:flex;min-height:100vh}

.rail{width:80px;flex:0 0 80px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:sticky;top:0;height:100vh}
.rail button{width:54px;height:54px;border:0;border-radius:16px;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center;padding:0}
.rail button svg,.bottom button svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button svg{width:26px;height:26px}
.rail button:hover{background:var(--panel2);color:var(--txt)}
.rail button.on{background:var(--acc);color:var(--ink)}

.bottom{display:none}
body.m .rail{display:none}
body.m .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:rgba(7,7,9,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom button{flex:1;position:relative;background:transparent;border:0;color:var(--mute);
  display:grid;place-items:center;gap:3px;font-size:10px;padding:10px 0 9px;cursor:pointer}
.bottom button svg{width:24px;height:24px}
.bottom button.on{color:var(--txt)}
.bottom button.on::before{content:"";position:absolute;top:0;width:30px;height:3px;background:var(--acc);border-radius:0 0 4px 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:20px 24px 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
h3{margin:0 0 10px;font-size:15px}
.sub{color:var(--dim);font-size:13px}
.modesw{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
.modesw:hover{color:var(--txt);border-color:var(--acc)}
.tabs{display:flex;gap:18px;padding:14px 24px 0;border-bottom:1px solid var(--line);background:var(--panel);margin-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs a{padding:0 2px 10px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;white-space:nowrap}
.tabs a.on{color:var(--txt);border-color:var(--acc)}
.body{padding:22px 24px 70px}

.btn{background:var(--acc);border:1px solid var(--acc);color:var(--ink);padding:10px 15px;border-radius:10px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--txt);font-weight:400}
.btn.ghost:hover{border-color:var(--acc)}
.btn.danger{color:var(--bad)}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 11px;font:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:16px 0 7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form{max-width:660px}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer}
.tcard:hover{border-color:var(--acc)}
.tcard h3{margin:0 0 4px}
.big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.c-ok{color:var(--ok)}.c-sky{color:var(--sky)}.c-gold{color:var(--gold)}.c-or{color:var(--orange)}.c-bad{color:var(--bad)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--dim);padding:8px 14px;border-radius:9px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:var(--ink);font-weight:600}
.presets{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.pcard{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:12px;padding:11px 13px;cursor:pointer;font:inherit}
.pcard:hover{border-color:var(--acc)}
.pcard b{font-size:13px;font-weight:600}
.pcard span{font-size:11px;color:var(--dim)}
.teams{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px 9px}
.trow input[type=text],.trow .ti,.trow .tn{background:transparent;border:0;padding:5px 2px;border-radius:0}
.trow input:focus{outline:none;border:0}
.trow .ti{flex:0 0 130px;color:var(--dim);font-size:12px}
.trow .x{background:transparent;border:0;color:var(--mute);cursor:pointer;font-size:14px;padding:4px 6px}
.trow .x:hover{color:var(--bad)}
.up{cursor:pointer;color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px;background:var(--soft);white-space:nowrap}
.up:hover{color:var(--txt);border-color:var(--acc)}
.seedno{color:var(--mute);font-size:11px;width:18px;text-align:right;flex:0 0 18px}
.hint{color:var(--mute);font-size:12px;margin-top:18px;max-width:800px;line-height:1.6}
.sec{margin:46px 0 14px;color:var(--txt);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.sec:first-child{margin-top:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--dim);font-weight:500}
.empty{color:var(--dim);padding:20px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}

/* ---------- zoom / pan stage ---------- */
.zoombar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.zbtn{width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0}
.zbtn:hover{border-color:var(--acc)}
.zval{min-width:58px;text-align:center;color:var(--dim);font-size:13px}
.stage{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  height:calc(100vh - 300px);min-height:400px;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.zoom{position:absolute;left:0;top:0;transform-origin:0 0;padding:16px 20px 24px}

/* ---------- bracket grid ---------- */
.grid-br{display:grid;grid-template-columns:repeat(var(--cols),var(--col));grid-auto-rows:var(--unit);column-gap:var(--gap);min-width:max-content}
.rhead{grid-row:1;align-self:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  text-align:center;padding:7px 8px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead.hl{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.cell{display:flex;align-items:center;position:relative}
.cell.out-r::after{content:"";position:absolute;left:100%;top:50%;width:calc(var(--gap) / 2);border-top:1px solid var(--wire)}
.cell.in-l::before{content:"";position:absolute;right:100%;top:50%;width:calc(var(--gap) / 2);border-top:1px solid var(--wire)}
.cell .v{position:absolute;left:calc(100% + var(--gap) / 2);top:50%;height:100%;border-left:1px solid var(--wire)}

/* ---------- match card ---------- */
.match{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;width:100%}
.slot{display:flex;align-items:center;gap:9px;padding:6px 9px;border-bottom:1px solid var(--line);min-height:33px}
.slot:last-child{border-bottom:0}
.slot.win{box-shadow:inset 3px 0 0 var(--ok);background:rgba(46,232,138,.05)}
.slot.lose{box-shadow:inset 3px 0 0 var(--bad)}
.slot.win .nm{color:#fff;font-weight:600}
.slot.lose .nm{color:var(--dim)}
.nmw{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.nmw.pick{cursor:pointer}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.slot.free .nm{color:var(--mute)}
.ic{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;background:transparent;border:0;border-radius:0;
  overflow:hidden;font-size:14px;line-height:1;color:var(--mute)}
img.ic{object-fit:contain}
.ic.q{font-size:13px;font-weight:700;color:var(--mute)}
.sc{width:24px;flex:0 0 24px;text-align:center;background:transparent;border:0;outline:none;color:var(--dim);font:inherit;padding:0;border-radius:0}
.sc:focus{outline:none;border:0}
.slot.win .sc{color:#fff;font-weight:700}
.mark{font-size:12px;line-height:1}
.mark.w{color:var(--ok);font-weight:700}
.mark.d{color:var(--bad);font-weight:700}
.mark.o{color:var(--mute)}
.mark.t{font-size:13px}

/* ---------- mobile ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0 12px}
.chip{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 15px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.mlist{display:flex;flex-direction:column;gap:12px}
.mmatch{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead{padding:9px 13px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.mhead b{color:var(--sky);font-weight:600}
body.m{--gap:52px;--col:196px;--unit:34px}
body.m .top{padding:16px 14px 0}
body.m .tabs{padding:12px 14px 0;gap:16px}
body.m .body{padding:16px 14px 96px}
body.m h1{font-size:19px}
body.m .fgrid{grid-template-columns:1fr}
body.m .trow .ti{flex:0 0 84px}
body.m .grid{grid-template-columns:1fr 1fr}
body.m .stage{height:calc(100vh - 290px);min-height:340px}
body.m .mlist .slot{min-height:50px;padding:11px 13px;gap:11px}
body.m .mlist .ic{width:30px;height:30px;flex-basis:30px;font-size:17px}
body.m .mlist .nm{font-size:15px}
body.m .mlist .sc{width:40px;flex-basis:40px;font-size:18px;font-weight:600}
body.m .mlist .slot.win{box-shadow:inset 4px 0 0 var(--ok)}
body.m .mlist .slot.lose{box-shadow:inset 4px 0 0 var(--bad)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;z-index:30}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(440px,100%);max-height:84vh;overflow:auto}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left}
.pitem:hover{border-color:var(--acc)}
.pitem em{margin-left:auto;color:var(--mute);font-style:normal;font-size:11px}

@media(max-width:1100px){:root{--gap:60px;--col:210px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <div class="top" id="top"></div>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="view"></div>
  </div>
</div>
<nav class="bottom" id="bottom"></nav>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
/* ================= storage ================= */
var KEY='bracket.v2',MODEKEY='ui.mode';
function loadDb(){try{return JSON.parse(localStorage.getItem(KEY))||{list:[]}}catch(e){return{list:[]}}}
var db=loadDb();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Не хватает места в браузере — уменьшите логотипы или удалите старые турниры')}}
var S={view:'home',id:null,round:0,rounds:false,z:1,tx:0,ty:0,fitKey:''};
var draft=null,PKICON='';

/* ================= device ================= */
function detectMode(){
  try{
    var ua=navigator.userAgent||'';
    var phone=/Android|iPhone|iPod|Windows Phone|IEMobile|Opera Mini|Mobile/i.test(ua);
    var touch=(navigator.maxTouchPoints||0)>1;
    var w=window.innerWidth||document.documentElement.clientWidth;
    if(phone&&w<=1024)return 'mobile';
    if(touch&&w<=900)return 'mobile';
    return w<=760?'mobile':'desktop';
  }catch(e){return 'desktop'}
}
var override=null;try{override=localStorage.getItem(MODEKEY)}catch(e){}
if(override!=='mobile'&&override!=='desktop')override=null;
var MODE=override||detectMode();
function applyMode(){document.body.className=(MODE==='mobile'?'m':'d')}
var rt=null;
window.addEventListener('resize',function(){
  if(override)return;
  clearTimeout(rt);rt=setTimeout(function(){var m=detectMode();if(m!==MODE){MODE=m;applyMode();S.fitKey='';render()}},180);
});

/* ================= helpers ================= */
function cur(){for(var i=0;i<db.list.length;i++){if(db.list[i].id===S.id)return db.list[i]}return null}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function iconHTML(t){
  var ic=t?String(t.icon||'').trim():'';
  if(/^(https?:\/\/|data:image)/i.test(ic))return '<img class="ic" src="'+esc(ic)+'" alt="">';
  if(ic)return '<span class="ic">'+esc(ic.slice(0,2))+'</span>';
  return '<span class="ic q">?</span>';
}
function pow2up(x){var s=2;while(s<x)s*=2;return s}
function addLog(t,msg){t.log=t.log||[];t.log.push({at:new Date().toLocaleString(),msg:msg});if(t.log.length>200)t.log.shift()}
function readIcon(file,cb){
  if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var max=Math.max(img.width,img.height),k=Math.min(1,72/max),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL('image/png'));
      }catch(e){cb(fr.result)}
    };
    img.onerror=function(){cb(fr.result)};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ================= presets ================= */
var PRESETS=[
  {icon:'\ud83d\udc09',game:'Dota 2',name:'The International — Playoffs',date:'Main Event',format:'double',bo:3,size:8,
   teams:[['Team Spirit','\ud83d\udc7b'],['PSG.LGD','\ud83d\udc3c'],['OG','\ud83d\udfe2'],['Tundra Esports','\ud83e\udd8c'],
          ['Gaimin Gladiators','\ud83d\udee1'],['Team Liquid','\ud83d\udca7'],['Virtus.pro','\ud83d\udc3b'],['Xtreme Gaming','\ud83d\udc2f']]},
  {icon:'\ud83c\udfaf',game:'CS2',name:'CS2 Major — Champions Stage',date:'Playoffs',format:'single',bo:3,size:8,
   teams:[['Natus Vincere','\u2b50'],['FaZe Clan','\ud83d\udd25'],['Team Vitality','\ud83d\udc1d'],['G2 Esports','\u2694\ufe0f'],
          ['Team Spirit','\ud83d\udc7b'],['MOUZ','\ud83d\udc2d'],['Astralis','\u2734\ufe0f'],['Heroic','\ud83e\udd81']]},
  {icon:'\u2694\ufe0f',game:'League of Legends',name:'Worlds — Knockout Stage',date:'October',format:'single',bo:5,size:8,
   teams:[['T1','\ud83d\udd34'],['Gen.G','\ud83d\udfe1'],['JD Gaming','\ud83d\udc32'],['Bilibili Gaming','\ud83d\udc3a'],
          ['Weibo Gaming','\ud83d\udd4a\ufe0f'],['KT Rolster','\ud83d\udfe3'],['LNG Esports','\ud83d\udc09'],['Fnatic','\ud83d\udfe0']]},
  {icon:'\ud83d\udd2b',game:'Valorant',name:'VCT Champions — Playoffs',date:'Grand Final week',format:'double',bo:3,size:8,
   teams:[['Sentinels','\ud83c\udfaf'],['EDward Gaming','\ud83e\udd85'],['Fnatic','\ud83d\udfe0'],['Paper Rex','\ud83e\udd96'],
          ['LOUD','\ud83d\udc9a'],['Team Heretics','\u26ab'],['DRX','\ud83d\udc0a'],['G2 Esports','\u2694\ufe0f']]},
  {icon:'\ud83d\ude80',game:'Rocket League',name:'RLCS World Championship',date:'Main Stage',format:'double',bo:5,size:8,
   teams:[['Karmine Corp','\ud83d\udd35'],['Team BDS','\u26a1'],['G2 Esports','\u2694\ufe0f'],['NRG','\ud83c\udfce\ufe0f'],
          ['Team Vitality','\ud83d\udc1d'],['FURIA','\ud83d\udc06'],['Moist Esports','\ud83c\udf0a'],['Spacestation','\ud83d\udef8']]}
];

/* ================= model ================= */
function seedOrder(n){var a=[0];for(var s=1;s<n;s*=2){var b=[];for(var i=0;i<a.length;i++){b.push(a[i]);b.push(s*2-1-a[i])}a=b}return a}
function build(t){
  var size=t.size||4,n=Math.round(Math.log(size)/Math.LN2),W=[],L=[],all=[],i,r,k,gf=null;
  function mk(br,rd,ix,a,b){var m={id:br+rd+'-'+ix,bracket:br,round:rd,idx:ix,a:a,b:b};all.push(m);return m}
  var ord=seedOrder(size);
  W[0]=[];for(i=0;i<size/2;i++)W[0].push(mk('W',0,i,{seed:ord[i*2]},{seed:ord[i*2+1]}));
  for(r=1;r<n;r++){W[r]=[];for(i=0;i<size/Math.pow(2,r+1);i++)W[r].push(mk('W',r,i,{w:W[r-1][i*2].id},{w:W[r-1][i*2+1].id}))}
  if(t.format==='double'&&size>=4){
    var li=0,L0=[];
    for(i=0;i<size/4;i++)L0.push(mk('L',li,i,{l:W[0][i*2].id},{l:W[0][i*2+1].id}));
    L.push(L0);li++;
    for(k=1;k<n;k++){
      var prev=L[L.length-1];
      if(k>1){var mn=[];for(i=0;i<prev.length/2;i++)mn.push(mk('L',li,i,{w:prev[i*2].id},{w:prev[i*2+1].id}));L.push(mn);li++}
      var src=L[L.length-1],mj=[];
      for(i=0;i<W[k].length;i++)mj.push(mk('L',li,i,{w:src[i].id},{l:W[k][i].id}));
      L.push(mj);li++;
    }
    gf=mk('GF',0,0,{w:W[n-1][0].id},{w:L[L.length-1][0].id});
  }
  return {size:size,n:n,W:W,L:L,gf:gf,all:all};
}
function solve(t){
  var B=build(t),out={},res=t.results||{},map={},i;
  for(i=0;i<t.teams.length;i++)map[t.teams[i].id]=t.teams[i];
  function val(s){
    if(!s)return null;
    if('seed' in s){var id=t.seeds[s.seed];return id?(map[id]||null):null}
    if(s.w)return out[s.w]?out[s.w].winner:null;
    return out[s.l]?out[s.l].loser:null;
  }
  for(i=0;i<B.all.length;i++){
    var m=B.all[i],a=val(m.a),b=val(m.b),r=res[m.id]||{};
    m.ta=a;m.tb=b;m.sa=r.sa==null?0:r.sa;m.sb=r.sb==null?0:r.sb;
    var w=null,l=null;
    if(a&&b&&m.sa!==m.sb){if(m.sa>m.sb){w=a;l=b}else{w=b;l=a}}
    out[m.id]={winner:w,loser:l};m.winner=w;m.loser=l;
  }
  (B.gf||B.W[B.W.length-1][0]).isFinal=true;
  B.map=map;return B;
}

/* ================= match rendering ================= */
function slotHTML(m,side){
  var team=side==='a'?m.ta:m.tb,sc=side==='a'?m.sa:m.sb,src=side==='a'?m.a:m.b;
  var seed=(src&&'seed' in src&&src.seed!=null)?src.seed:null;
  var st='';
  if(m.winner){st=(team&&team===m.winner)?'win':(team?'lose':'')}
  var mark='';

/* ================= zoom & pan ================= */
function stageEl(){return document.getElementById('stage')}
function zoomEl(){return document.getElementById('zoom')}
function applyZoom(){
  var z=zoomEl();if(!z)return;
  z.style.transform='translate('+S.tx+'px,'+S.ty+'px) scale('+S.z+')';
  var v=document.querySelector('.zval');if(v)v.textContent=Math.round(S.z*100)+'%';
}
function setZoom(nz,cx,cy){
  var st=stageEl();if(!st)return;
  nz=Math.max(0.2,Math.min(3,nz));
  var r=st.getBoundingClientRect(),px=(cx==null?r.width/2:cx-r.left),py=(cy==null?r.height/2:cy-r.top);
  S.tx=px-(px-S.tx)*(nz/S.z);S.ty=py-(py-S.ty)*(nz/S.z);S.z=nz;applyZoom();
}
function fitZoom(){
  var st=stageEl(),z=zoomEl();if(!st||!z)return;
  var w=z.scrollWidth||1,h=z.scrollHeight||1;
  var k=Math.min((st.clientWidth-10)/w,(st.clientHeight-10)/h,1.2);
  S.z=Math.max(0.2,k);S.tx=6;S.ty=6;applyZoom();
}
var PZ={pts:{},pan:false,sx:0,sy:0,btx:0,bty:0,moved:false,pd:0,bz:1,onInput:false,dragged:false};
function ptCount(){var n=0,k;for(k in PZ.pts)n++;return n}
function ptArr(){var a=[],k;for(k in PZ.pts)a.push(PZ.pts[k]);return a}
document.addEventListener('pointerdown',function(e){
  var st=e.target.closest?e.target.closest('.stage'):null;if(!st)return;
  PZ.pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=ptCount();
  if(n===1){PZ.pan=true;PZ.sx=e.clientX;PZ.sy=e.clientY;PZ.btx=S.tx;PZ.bty=S.ty;PZ.moved=false;
    PZ.onInput=!!(e.target.closest&&e.target.closest('input,button,.pick'));}
  if(n===2){var a=ptArr();PZ.pd=Math.sqrt(Math.pow(a[0].x-a[1].x,2)+Math.pow(a[0].y-a[1].y,2));PZ.bz=S.z;PZ.pan=false}
},true);
document.addEventListener('pointermove',function(e){
  if(!PZ.pts[e.pointerId])return;
  PZ.pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var a=ptArr();
  if(a.length>=2){
    var d=Math.sqrt(Math.pow(a[0].x-a[1].x,2)+Math.pow(a[0].y-a[1].y,2));
    if(PZ.pd>0)setZoom(PZ.bz*(d/PZ.pd),(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);
    PZ.moved=true;if(e.cancelable)e.preventDefault();return;
  }
  if(!PZ.pan)return;
  var dx=e.clientX-PZ.sx,dy=e.clientY-PZ.sy;
  if(!PZ.moved&&Math.abs(dx)+Math.abs(dy)<8)return;
  if(!PZ.moved&&PZ.onInput&&document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  PZ.moved=true;S.tx=PZ.btx+dx;S.ty=PZ.bty+dy;applyZoom();
  var st=stageEl();if(st)st.classList.add('drag');
  if(e.cancelable)e.preventDefault();
});
function endPointer(e){
  if(PZ.pts[e.pointerId])delete PZ.pts[e.pointerId];
  if(ptCount()===0){
    if(PZ.moved)PZ.dragged=true;
    PZ.pan=false;PZ.moved=false;
    var st=stageEl();if(st)st.classList.remove('drag');
  }
}
document.addEventListener('pointerup',endPointer);
document.addEventListener('pointercancel',endPointer);
document.addEventListener('wheel',function(e){
  var st=e.target.closest?e.target.closest('.stage'):null;if(!st)return;
  e.preventDefault();
  if(e.ctrlKey||e.metaKey||e.shiftKey){setZoom(S.z*(e.deltaY>0?0.9:1.1),e.clientX,e.clientY);return}
  S.tx-=e.deltaX;S.ty-=e.deltaY;applyZoom();
},{passive:false});

  if(S.view==='bracket'){
    var useRounds=(MODE==='mobile'&&S.rounds);
    v.innerHTML=useRounds?roundsHTML(t,B):stageHTML(t,B);

      var key=S.id+'|'+MODE+'|'+t.size+'|'+t.format;
      if(S.fitKey!==key){S.fitKey=key;fitZoom()}else applyZoom();
    }
    return;
  }
  v.innerHTML=S.view==='overview'?overviewHTML(t,B):S.view==='participants'?participantsHTML(t):
    S.view==='matches'?matchesHTML(t,B):S.view==='standings'?standingsHTML(t,B):logHTML(t);
}
