<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tournament Grid</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --bg:#000000;--panel:#070709;--panel2:#101116;--card:#131419;--soft:#191b21;
  --line:#25272f;--wire:#3b3f4c;
  --txt:#ffffff;--dim:#9aa1b3;--mute:#5f6577;
  --acc:#ffffff;--ink:#000000;
  --ok:#2ee88a;--bad:#ff4d61;--sky:#4cd6ff;--gold:#ffd166;--orange:#ff9a5a;
  --gap:56px;--col:224px;--unit:34px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{display:flex;min-height:100vh}

/* ---------- desktop rail ---------- */
.rail{width:80px;flex:0 0 80px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:sticky;top:0;height:100vh}
.rail button{width:54px;height:54px;border:0;border-radius:16px;background:transparent;color:var(--dim);cursor:pointer;display:grid;place-items:center;padding:0}
.rail button svg,.bottom button svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button svg{width:26px;height:26px}
.rail button:hover{background:var(--panel2);color:var(--txt)}
.rail button.on{background:var(--acc);color:var(--ink)}

/* ---------- mobile bottom bar ---------- */
.bottom{display:none}
body.m .rail{display:none}
body.m .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:rgba(7,7,9,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom button{flex:1;position:relative;background:transparent;border:0;color:var(--mute);
  display:grid;place-items:center;gap:3px;font-size:10px;padding:10px 0 9px;cursor:pointer}
.bottom button svg{width:24px;height:24px}
.bottom button.on{color:var(--txt)}
.bottom button.on::before{content:"";position:absolute;top:0;width:30px;height:3px;background:var(--acc);border-radius:0 0 4px 4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:20px 24px 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
h3{margin:0 0 10px;font-size:15px}
.sub{color:var(--dim);font-size:13px}
.modesw{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:7px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
.modesw:hover{color:var(--txt);border-color:var(--acc)}
.tabs{display:flex;gap:18px;padding:14px 24px 0;border-bottom:1px solid var(--line);background:var(--panel);margin-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs a{padding:0 2px 10px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;font-size:13px;white-space:nowrap}
.tabs a.on{color:var(--txt);border-color:var(--acc)}
.body{padding:22px 24px 70px}

.btn{background:var(--acc);border:1px solid var(--acc);color:var(--ink);padding:10px 15px;border-radius:10px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.btn.ghost{background:var(--panel2);border-color:var(--line);color:var(--txt);font-weight:400}
.btn.ghost:hover{border-color:var(--acc)}
.btn.danger{color:var(--bad)}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 11px;font:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--dim);margin:16px 0 7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form{max-width:640px}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer}
.tcard:hover{border-color:var(--acc)}
.tcard h3{margin:0 0 4px}
.big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.c-ok{color:var(--ok)}.c-sky{color:var(--sky)}.c-gold{color:var(--gold)}.c-or{color:var(--orange)}.c-bad{color:var(--bad)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--dim);padding:8px 14px;border-radius:9px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:var(--ink);font-weight:600}
.teams{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px 9px}
.trow input{background:transparent;border:0;padding:5px 2px;border-radius:0}
.trow input:focus{outline:none;border:0}
.trow .ti{flex:0 0 140px;color:var(--dim);font-size:12px}
.trow .x{background:transparent;border:0;color:var(--mute);cursor:pointer;font-size:14px;padding:4px 6px}
.trow .x:hover{color:var(--bad)}
.seedno{color:var(--mute);font-size:11px;width:18px;text-align:right;flex:0 0 18px}
.hint{color:var(--mute);font-size:12px;margin-top:18px;max-width:780px;line-height:1.6}
.sec{margin:26px 0 12px;color:var(--txt);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.sec:first-child{margin-top:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--dim);font-weight:500}
.empty{color:var(--dim);padding:20px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}

/* ---------- desktop bracket grid ---------- */
.grid-br{display:grid;grid-template-columns:repeat(var(--cols),var(--col));grid-auto-rows:var(--unit);column-gap:var(--gap);min-width:max-content}
.rhead{grid-row:1;align-self:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  text-align:center;padding:7px 8px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead.hl{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.cell{display:flex;align-items:center;position:relative}
.cell.out-r::after{content:"";position:absolute;left:100%;top:50%;width:calc(var(--gap) / 2);border-top:1px solid var(--wire)}
.cell.in-l::before{content:"";position:absolute;right:100%;top:50%;width:calc(var(--gap) / 2);border-top:1px solid var(--wire)}
.cell .v{position:absolute;left:calc(100% + var(--gap) / 2);top:50%;height:100%;border-left:1px solid var(--wire)}

/* ---------- match card (shared) ---------- */
.match{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;width:100%}
.slot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);min-height:31px}
.slot:last-child{border-bottom:0}
.slot.win{box-shadow:inset 3px 0 0 var(--ok);background:rgba(46,232,138,.05)}
.slot.lose{box-shadow:inset 3px 0 0 var(--bad)}
.slot.win .nm{color:#fff;font-weight:600}
.slot.lose .nm{color:var(--dim)}
.nmw{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.nmw.pick{cursor:pointer}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.slot.free .nm{color:var(--mute)}
.ic{width:20px;height:20px;flex:0 0 20px;border-radius:6px;display:grid;place-items:center;background:var(--soft);font-size:10px;color:var(--dim);object-fit:cover;overflow:hidden}
.sc{width:24px;flex:0 0 24px;text-align:center;background:transparent;border:0;outline:none;color:var(--dim);font:inherit;padding:0;border-radius:0}
.sc:focus{outline:none;border:0}
.slot.win .sc{color:#fff;font-weight:700}
.mark{font-size:11px;line-height:1}
.mark.d{color:var(--bad)}.mark.o{color:var(--mute)}.mark.u{color:var(--ok)}

/* ---------- mobile bracket ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0 12px}
.chip{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 15px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.mlist{display:flex;flex-direction:column;gap:12px}
.mmatch{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead{padding:9px 13px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.mhead b{color:var(--sky);font-weight:600}
body.m .slot{min-height:50px;padding:11px 13px;gap:11px}
body.m .ic{width:28px;height:28px;flex-basis:28px;border-radius:8px;font-size:11px}
body.m .nm{font-size:15px}
body.m .sc{width:40px;flex-basis:40px;font-size:18px;font-weight:600}
body.m .slot.win{box-shadow:inset 4px 0 0 var(--ok)}
body.m .slot.lose{box-shadow:inset 4px 0 0 var(--bad)}
body.m .top{padding:16px 14px 0}
body.m .tabs{padding:12px 14px 0;gap:16px}
body.m .body{padding:16px 14px 96px}
body.m h1{font-size:19px}
body.m .btn,body.m .seg button,body.m .chip{padding-top:11px;padding-bottom:11px}
body.m .fgrid{grid-template-columns:1fr}
body.m .trow .ti{flex:0 0 96px}
body.m .grid{grid-template-columns:1fr 1fr}
body.m{--gap:34px;--col:170px;--unit:30px}
body.m .nm{font-size:13px}
body.m .full .slot{min-height:34px;padding:6px 8px;gap:7px}
body.m .full .ic{width:18px;height:18px;flex-basis:18px}
body.m .full .sc{width:22px;flex-basis:22px;font-size:13px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px;z-index:30}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(440px,100%);max-height:84vh;overflow:auto}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left}
.pitem:hover{border-color:var(--acc)}
.pitem em{margin-left:auto;color:var(--mute);font-style:normal;font-size:11px}

@media(max-width:1100px){:root{--gap:44px;--col:200px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <div class="top" id="top"></div>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="view"></div>
  </div>
</div>
<nav class="bottom" id="bottom"></nav>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
/* ================= storage ================= */
var KEY='bracket.v2',MODEKEY='ui.mode';
function loadDb(){try{return JSON.parse(localStorage.getItem(KEY))||{list:[]}}catch(e){return{list:[]}}}
var db=loadDb();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
var S={view:'home',id:null,round:0,full:false};
var draft=null;

/* ================= device ================= */
function detectMode(){
  try{
    var ua=navigator.userAgent||'';
    var phone=/Android|iPhone|iPod|Windows Phone|IEMobile|Opera Mini|Mobile Safari|Mobile/i.test(ua);
    var touch=(navigator.maxTouchPoints||0)>1;
    var w=window.innerWidth||document.documentElement.clientWidth;
    if(phone&&w<=1024)return 'mobile';
    if(touch&&w<=900)return 'mobile';
    return w<=760?'mobile':'desktop';
  }catch(e){return 'desktop'}
}
var override=null;try{override=localStorage.getItem(MODEKEY)}catch(e){}
var MODE=(override==='mobile'||override==='desktop')?override:detectMode();
function applyMode(){document.body.className=(MODE==='mobile'?'m':'d')}
function setMode(m){MODE=m;try{localStorage.setItem(MODEKEY,m)}catch(e){}applyMode();render()}
var rt=null;
window.addEventListener('resize',function(){
  if(override==='mobile'||override==='desktop')return;
  clearTimeout(rt);rt=setTimeout(function(){var m=detectMode();if(m!==MODE){MODE=m;applyMode();render()}},180);
});

/* ================= helpers ================= */
function cur(){for(var i=0;i<db.list.length;i++){if(db.list[i].id===S.id)return db.list[i]}return null}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function initials(n){var p=String(n||'').trim().split(/\s+/);var s=((p[0]||'').charAt(0)+(p[1]?p[1].charAt(0):''));return s.toUpperCase()||'?'}
function iconHTML(t){
  if(!t)return '<span class="ic"></span>';
  var ic=String(t.icon||'').trim();
  if(/^(https?:\/\/|data:image)/i.test(ic))return '<img class="ic" src="'+esc(ic)+'" alt="">';
  if(ic)return '<span class="ic">'+esc(ic.slice(0,2))+'</span>';
  return '<span class="ic">'+esc(initials(t.name))+'</span>';
}
function pow2up(x){var s=2;while(s<x)s*=2;return s}
function addLog(t,msg){t.log=t.log||[];t.log.push({at:new Date().toLocaleString(),msg:msg});if(t.log.length>200)t.log.shift()}

/* ================= model ================= */
function seedOrder(n){var a=[0];for(var s=1;s<n;s*=2){var b=[];for(var i=0;i<a.length;i++){b.push(a[i]);b.push(s*2-1-a[i])}a=b}return a}
function build(t){
  var size=t.size||4,n=Math.round(Math.log(size)/Math.LN2),W=[],L=[],all=[],i,r,k,gf=null;
  function mk(br,rd,ix,a,b){var m={id:br+rd+'-'+ix,bracket:br,round:rd,idx:ix,a:a,b:b};all.push(m);return m}
  var ord=seedOrder(size);
  W[0]=[];for(i=0;i<size/2;i++)W[0].push(mk('W',0,i,{seed:ord[i*2]},{seed:ord[i*2+1]}));
  for(r=1;r<n;r++){W[r]=[];for(i=0;i<size/Math.pow(2,r+1);i++)W[r].push(mk('W',r,i,{w:W[r-1][i*2].id},{w:W[r-1][i*2+1].id}))}
  if(t.format==='double'&&size>=4){
    var li=0,L0=[];
    for(i=0;i<size/4;i++)L0.push(mk('L',li,i,{l:W[0][i*2].id},{l:W[0][i*2+1].id}));
    L.push(L0);li++;
    for(k=1;k<n;k++){
      var prev=L[L.length-1];
      if(k>1){var mn=[];for(i=0;i<prev.length/2;i++)mn.push(mk('L',li,i,{w:prev[i*2].id},{w:prev[i*2+1].id}));L.push(mn);li++}
      var src=L[L.length-1],mj=[];
      for(i=0;i<W[k].length;i++)mj.push(mk('L',li,i,{w:src[i].id},{l:W[k][i].id}));
      L.push(mj);li++;
    }
    gf=mk('GF',0,0,{w:W[n-1][0].id},{w:L[L.length-1][0].id});
  }
  return {size:size,n:n,W:W,L:L,gf:gf,all:all};
}
function solve(t){
  var B=build(t),out={},res=t.results||{},map={},i;
  for(i=0;i<t.teams.length;i++)map[t.teams[i].id]=t.teams[i];
  function val(s){
    if(!s)return null;
    if('seed' in s){var id=t.seeds[s.seed];return id?(map[id]||null):null}
    if(s.w)return out[s.w]?out[s.w].winner:null;
    return out[s.l]?out[s.l].loser:null;
  }
  for(i=0;i<B.all.length;i++){
    var m=B.all[i],a=val(m.a),b=val(m.b),r=res[m.id]||{};
    m.ta=a;m.tb=b;m.sa=r.sa==null?0:r.sa;m.sb=r.sb==null?0:r.sb;
    var w=null,l=null;
    if(a&&b&&m.sa!==m.sb){if(m.sa>m.sb){w=a;l=b}else{w=b;l=a}}
    out[m.id]={winner:w,loser:l};m.winner=w;m.loser=l;
  }
  B.map=map;return B;
}

/* ================= match rendering ================= */
function slotHTML(m,side){
  var team=side==='a'?m.ta:m.tb,sc=side==='a'?m.sa:m.sb,src=side==='a'?m.a:m.b;
  var seed=(src&&'seed' in src&&src.seed!=null)?src.seed:null;
  var st='';
  if(m.winner){st=(team&&team===m.winner)?'win':(team?'lose':'')}
  var mark='';
  if(st==='lose')mark=m.bracket==='W'?'<span class="mark d">↓</span>':'<span class="mark o">✕</span>';
  if(st==='win'&&m.bracket==='L')mark='<span class="mark u">↑</span>';
  var label=team?esc(team.name):(seed!=null?'Свободно':'TBD');
  return '<div class="slot '+st+(team?'':' free')+'">'+
    '<span class="nmw'+(seed!=null?' pick" data-seed="'+seed+'"':'"')+'>'+iconHTML(team)+'<span class="nm">'+label+'</span></span>'+
    mark+'<input class="sc" data-m="'+m.id+'" data-s="'+side+'" value="'+sc+'" inputmode="numeric"></div>';
}
function matchHTML(m){return '<div class="match">'+slotHTML(m,'a')+slotHTML(m,'b')+'</div>'}
function gridHTML(rounds,labels,hl){
  var totalRows=rounds[0].length*2,h='<div class="scroll"><div class="grid-br" style="--cols:'+rounds.length+'">',r,i;
  for(r=0;r<rounds.length;r++){
    var cnt=rounds[r].length,span=totalRows/cnt,next=rounds[r+1];
    h+='<div class="rhead'+(r===hl?' hl':'')+'" style="grid-column:'+(r+1)+'">'+esc(labels[r])+'</div>';
    for(i=0;i<cnt;i++){
      var pairs=!!next&&next.length!==cnt,cls='cell';
      if(next)cls+=' out-r';
      if(r>0)cls+=' in-l';
      h+='<div class="'+cls+'" style="grid-column:'+(r+1)+';grid-row:'+(2+i*span)+' / span '+span+'">'+
        matchHTML(rounds[r][i])+(pairs&&i%2===0?'<i class="v"></i>':'')+'</div>';
    }
  }
  return h+'</div></div>';
}
function wLabels(t,B){
  var out=[],n=B.W.length,r;
  for(r=0;r<n;r++){
    var cnt=B.W[r].length;
    if(t.format==='double')out.push(r===n-1?'Upper Final':'Upper Bracket R'+(r+1));
    else out.push(cnt===1?'Final':cnt===2?'Semi-finals':cnt===4?'Quarter-finals':'Round '+(r+1));
  }
  return out;
}
function lLabels(B){var o=[],r;for(r=0;r<B.L.length;r++)o.push(r===B.L.length-1?'Lower Final':'Lower Bracket R'+(r+1));return o}
function legendHTML(){
  return '<div class="hint">Победитель — <span class="c-ok">зелёная полоса слева</span>, проигравший — <span class="c-bad">красная</span>. ↓ — переход в нижнюю сетку, ↑ — выход в Grand Final, ✕ — вылет. Свободные слоты первого раунда кликабельны, счёт начинается с 0:0.</div>';
}
function bracketHTML(t,B){
  var wr=B.W.slice(),wl=wLabels(t,B);
  if(B.gf){wr.push([B.gf]);wl.push('Grand Final')}
  var h='<div class="sec">Upper Bracket · Bo'+t.bo+'</div>'+gridHTML(wr,wl,wr.length-1);
  if(B.L.length)h+='<div class="sec">Lower Bracket</div>'+gridHTML(B.L,lLabels(B),-1);
  return h+legendHTML();
}
/* ---- mobile: round-by-round ---- */
function roundList(t,B){
  var out=[],r;
  for(r=0;r<B.W.length;r++)out.push({label:wLabels(t,B)[r],short:(t.format==='double'?'UB R'+(r+1):'R'+(r+1)),ms:B.W[r]});
  if(t.format==='double'&&B.W.length)out[B.W.length-1].short='UB Final';
  if(!B.L.length&&B.W.length)out[B.W.length-1].short='Final';
  var ll=lLabels(B);
  for(r=0;r<B.L.length;r++)out.push({label:ll[r],short:(r===B.L.length-1?'LB Final':'LB R'+(r+1)),ms:B.L[r]});
  if(B.gf)out.push({label:'Grand Final',short:'★ GF',ms:[B.gf]});
  return out;
}
function mBracketHTML(t,B){
  if(S.full)return '<div class="row" style="margin-bottom:14px"><button class="btn ghost" data-act="full">← По раундам</button></div>'+
    '<div class="full">'+bracketHTML(t,B)+'</div>';
  var rs=roundList(t,B),i;
  if(S.round>=rs.length)S.round=rs.length-1;
  if(S.round<0)S.round=0;
  var h='<div class="chips">';
  for(i=0;i<rs.length;i++)h+='<button class="chip'+(i===S.round?' on':'')+'" data-round="'+i+'">'+esc(rs[i].short)+'</button>';
  h+='</div><div class="sec">'+esc(rs[S.round].label)+'</div><div class="mlist">';
  var ms=rs[S.round].ms;
  for(i=0;i<ms.length;i++){

/* ================= events ================= */
document.addEventListener('click',function(e){
  var el=e.target,C=function(s){return el.closest?el.closest(s):null};
  var seg=C('.seg button'),nav=C('[data-nav]'),tab=C('[data-tab]'),open=C('[data-open]'),
      act=C('[data-act]'),pick=C('.nmw.pick'),chip=C('[data-round]');
  if(el.id==='modal'){closeModal();return}
  if(chip){S.round=+chip.getAttribute('data-round');render();return}
  if(seg){
    var k=seg.parentNode.getAttribute('data-seg'),v=seg.getAttribute('data-v');
    if(k==='mode'){override=(v==='auto')?null:v;try{v==='auto'?localStorage.removeItem(MODEKEY):localStorage.setItem(MODEKEY,v)}catch(er){}
      MODE=override||detectMode();applyMode();render();return}
    if(S.view==='new'){draft[k]=(k==='bo'||k==='size')?+v:v}
    else{var t0=cur();if(!t0)return;
      t0[k]=(k==='bo'||k==='size')?+v:v;
      if(k==='size'||k==='format'){
        t0.seeds=t0.seeds.slice(0,t0.size);
        while(t0.seeds.length<t0.size)t0.seeds.push(null);
        t0.results={};S.round=0;addLog(t0,'Сетка перестроена: '+(t0.format==='double'?'Double':'Single')+', '+t0.size+' мест');
      }
      save();}
    render();return;
  }
  if(nav){var n=nav.getAttribute('data-nav');
    if(n==='new'){draft=newDraft();S.view='new'}
    else S.view=(n==='home'||n==='export')?n:(S.id?n:'home');
    render();return;}
  if(tab){S.view=tab.getAttribute('data-tab');render();return}
  if(open){S.id=open.getAttribute('data-open');S.view='bracket';S.round=0;render();return}
  if(pick&&!act){openPicker(+pick.getAttribute('data-seed'));return}
  if(!act)return;
  var a=act.getAttribute('data-act'),t=cur(),i;
  if(a==='closeModal'){closeModal();return}
  if(a==='mode'){setMode(MODE==='mobile'?'desktop':'mobile');override=MODE;return}
  if(a==='full'){S.full=!S.full;render();return}
  if(a==='prevR'){S.round=Math.max(0,S.round-1);render();window.scrollTo(0,0);return}
  if(a==='nextR'){S.round=S.round+1;render();window.scrollTo(0,0);return}
  if(a==='new'){draft=newDraft();S.view='new';render();return}
  if(a==='home'){S.view='home';render();return}
  if(a==='addTeam'){var arr=teamsTarget();if(!arr)return;arr.push({name:'',icon:'',id:S.view==='new'?undefined:uid()});if(t&&S.view!=='new')save();render();return}
  if(a==='delTeam'){var arr2=teamsTarget();if(!arr2)return;var idx=+act.getAttribute('data-i'),rm=arr2.splice(idx,1)[0];
    if(t&&S.view!=='new'&&rm&&rm.id){for(i=0;i<t.seeds.length;i++)if(t.seeds[i]===rm.id)t.seeds[i]=null;save()}
    render();return}
  if(a==='bulk'){openBulk();return}
  if(a==='bulkAdd'){
    var txt=document.getElementById('bulk').value.split('\n'),arr3=teamsTarget();
    for(i=0;i<txt.length;i++){var line=txt[i].trim();if(!line)continue;
      var parts=line.split('|'),nm=parts[0].trim(),ic=(parts[1]||'').trim();
      if(nm)arr3.push({name:nm,icon:ic,id:S.view==='new'?undefined:uid()});}
    if(t&&S.view!=='new')save();
    closeModal();render();return;
  }
  if(a==='create'){
    var teams=[],src=draft.teams;
    for(i=0;i<src.length;i++){var nm2=(src[i].name||'').trim();if(nm2)teams.push({id:uid(),name:nm2,icon:(src[i].icon||'').trim()})}
    if(teams.length<2){alert('Нужно минимум 2 команды');return}
    var size=Math.max(draft.size,pow2up(teams.length)),seeds=[];
    for(i=0;i<size;i++)seeds.push(i<teams.length?teams[i].id:null);
    var nt={id:uid(),name:draft.name.trim()||'Турнир',date:draft.date.trim(),format:draft.format,bo:draft.bo,
      size:size,teams:teams,seeds:seeds,results:{},log:[]};
    addLog(nt,'Турнир создан: '+teams.length+' команд, '+size+' мест');
    db.list.push(nt);save();S.id=nt.id;S.view='bracket';S.round=0;render();return;
  }
  if(a==='import'){
    try{var d=JSON.parse(document.getElementById('io').value);if(!d.list)throw 0;db=d;save();S.view='home';render()}
    catch(err){alert('Некорректный JSON')}
    return;
  }
  if(!t)return;
  if(a==='pick'){
    var id=act.getAttribute('data-team'),slot=+act.getAttribute('data-slot'),old=-1;
    for(i=0;i<t.seeds.length;i++)if(t.seeds[i]===id)old=i;
    var prev=t.seeds[slot]||null;
    t.seeds[slot]=id;
    if(old>=0&&old!==slot)t.seeds[old]=prev;
    addLog(t,'Посев обновлён');save();closeModal();render();return;
  }
  if(a==='clearSlot'){t.seeds[+act.getAttribute('data-slot')]=null;save();closeModal();render();return}
  if(a==='pkAdd'){
    var nm3=document.getElementById('pk-name').value.trim();if(!nm3){closeModal();return}
    var team={id:uid(),name:nm3,icon:document.getElementById('pk-icon').value.trim()};
    t.teams.push(team);t.seeds[+act.getAttribute('data-slot')]=team.id;
    addLog(t,'Команда добавлена: '+nm3);save();closeModal();render();return;
  }
  if(a==='fill'){
    var free=[],un=[];
    for(i=0;i<t.seeds.length;i++)if(!t.seeds[i])free.push(i);
    for(i=0;i<t.teams.length;i++){var placed=false;
      for(var j=0;j<t.seeds.length;j++)if(t.seeds[j]===t.teams[i].id)placed=true;
      if(!placed)un.push(t.teams[i].id)}
    for(i=0;i<free.length&&i<un.length;i++)t.seeds[free[i]]=un[i];
    addLog(t,'Свободные места заполнены');save();render();return;
  }
  if(a==='shuffle'){
    var ids=t.seeds.filter(function(x){return !!x});
    for(i=ids.length-1;i>0;i--){var j2=Math.floor(Math.random()*(i+1)),tmp=ids[i];ids[i]=ids[j2];ids[j2]=tmp}
    for(i=0;i<t.seeds.length;i++)t.seeds[i]=i<ids.length?ids[i]:null;
    t.results={};addLog(t,'Посев перемешан');save();render();return;
  }
  if(a==='reset'){if(confirm('Сбросить все результаты?')){t.results={};addLog(t,'Результаты сброшены');save();render()}return}
  if(a==='del'){if(confirm('Удалить турнир «'+t.name+'»?')){db.list=db.list.filter(function(x){return x.id!==t.id});save();S.id=null;S.view='home';render()}return}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='f-name'){draft.name=el.value;return}
  if(el.id==='f-date'){draft.date=el.value;return}
  var row=el.closest?el.closest('.trow'):null;
  if(row&&el.getAttribute('data-f')){
    var arr=teamsTarget();if(!arr)return;
    var i=+el.getAttribute('data-i'),f=el.getAttribute('data-f');
    arr[i][f]=el.value;
    if(f==='icon'){var ic=row.querySelector('.ic');if(ic){var tmp=document.createElement('div');tmp.innerHTML=iconHTML(arr[i]);row.replaceChild(tmp.firstChild,ic)}}
    if(S.view!=='new')save();
    return;
  }
  var sc=el.closest?el.closest('.sc'):null;
  if(sc){
    var t=cur();if(!t)return;
    var id=sc.getAttribute('data-m'),side=sc.getAttribute('data-s');
    t.results=t.results||{};t.results[id]=t.results[id]||{};
    t.results[id][side==='a'?'sa':'sb']=Math.max(0,parseInt(sc.value,10)||0);
    save();render();
    var again=document.querySelector('.sc[data-m="'+id+'"][data-s="'+side+'"]');
    if(again){again.focus();try{again.setSelectionRange(again.value.length,again.value.length)}catch(err){}}
  }
});
document.addEventListener('focusin',function(e){if(e.target.classList&&e.target.classList.contains('sc'))e.target.select()});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js')['catch'](function(){})})}
applyMode();render();
</script>
</body>
