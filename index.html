<!DOCTYPE html>
<html lang="ru"><head>

<style>

.bottom{display:none}body.m .rail{display:none}

.bottom button{flex:1;position:relative;background:none;border:0;color:var(--mute);display:grid;place-items:center;gap:3px;font-size:10px;padding:10px 0 9px;cursor:pointer}
.bottom svg{width:24px;height:24px}.bottom button.on{color:var(--txt)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:20px 24px 0;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}

.tabs{display:flex;gap:18px;padding:14px 24px 0;border-bottom:1px solid var(--line);background:var(--panel);margin-top:14px;overflow-x:auto}

.body{padding:22px 24px 70px}
.btn{background:var(--acc);border:1px solid var(--acc);color:var(--ink);padding:10px 15px;border-radius:10px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}

label{display:block;font-size:12px;color:var(--dim);margin:16px 0 7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.form{max-width:680px}

.big{font-size:20px;font-weight:700}
.c-ok{color:var(--ok)}.c-sky{color:var(--sky)}.c-gold{color:var(--gold)}.c-or{color:var(--or)}.c-bad{color:var(--bad)}

.pcard:hover{border-color:var(--acc)}.pcard b{font-size:13px}.pcard span{font-size:11px;color:var(--dim)}
.teams{display:flex;flex-direction:column;gap:8px}

.x{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 6px;font:inherit}.x:hover{color:var(--bad)}
.up{cursor:pointer;color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:11px;background:var(--soft);white-space:nowrap}

.zoombar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.zbtn{width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer}.zbtn:hover{border-color:var(--acc)}
.zval{min-width:58px;text-align:center;color:var(--dim);font-size:13px}
.stage{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;height:calc(100vh - 300px);min-height:400px;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}.zoom{position:absolute;left:0;top:0;transform-origin:0 0;padding:16px 22px 26px}
.grid-br{display:grid;grid-template-columns:repeat(var(--cols),var(--col));grid-auto-rows:var(--unit);column-gap:var(--gap);min-width:max-content}
.rhead{grid-row:1;align-self:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;text-align:center;padding:7px 8px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
.rhead.hl{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.cell{display:flex;align-items:center;position:relative}
.cell.out-r::after{content:"";position:absolute;left:100%;top:50%;width:calc(var(--gap)/2);border-top:1px solid var(--wire)}
.cell.in-l::before{content:"";position:absolute;right:100%;top:50%;width:calc(var(--gap)/2);border-top:1px solid var(--wire)}
.cell .v{position:absolute;left:calc(100% + var(--gap)/2);top:50%;height:100%;border-left:1px solid var(--wire)}
.match{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;width:100%}
.slot{display:flex;align-items:center;gap:9px;padding:6px 9px;border-bottom:1px solid var(--line);min-height:33px}
.slot:last-child{border-bottom:0}
.slot.win{box-shadow:inset 3px 0 0 var(--ok);background:rgba(46,232,138,.05)}
.slot.lose{box-shadow:inset 3px 0 0 var(--bad)}
.slot.win .nm{font-weight:600}.slot.lose .nm{color:var(--dim)}
.nmw{display:flex;align-items:center;gap:9px;flex:1;min-width:0}.nmw.pick{cursor:pointer}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.slot.free .nm{color:var(--mute)}
.ic{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;background:none;border:0;border-radius:0;overflow:hidden;font-size:14px;line-height:1;color:var(--mute)}
img.ic{object-fit:contain}.ic.q{font-weight:700;font-size:13px}
.sc{width:24px;flex:0 0 24px;text-align:center;background:none;border:0;color:var(--dim);font:inherit;padding:0;border-radius:0}
.sc:focus{outline:none;border:0}.slot.win .sc{color:#fff;font-weight:700}
.mark{font-size:12px;line-height:1}.mark.w{color:var(--ok);font-weight:700}.mark.d{color:var(--bad);font-weight:700}.mark.o{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.chip{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:9px 15px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.mlist{display:flex;flex-direction:column;gap:12px}
.mmatch{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mhead{padding:9px 13px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.mhead b{color:var(--sky);font-weight:600}
body.m{--gap:54px;--col:198px;--unit:34px}
body.m .top{padding:16px 14px 0}body.m .tabs{padding:12px 14px 0;gap:16px}body.m .body{padding:16px 14px 96px}
body.m h1{font-size:19px}body.m .fgrid{grid-template-columns:1fr}body.m .trow .ti{flex:0 0 72px}body.m .grid{grid-template-columns:1fr 1fr}
body.m .stage{height:calc(100vh - 300px);min-height:340px}
body.m .mlist .slot{min-height:50px;padding:11px 13px}
body.m .mlist .ic{width:30px;height:30px;flex-basis:30px;font-size:17px}
body.m .mlist .nm{font-size:15px}body.m .mlist .sc{width:40px;flex-basis:40px;font-size:18px;font-weight:600}
body.m .mlist .slot.win{box-shadow:inset 4px 0 0 var(--ok)}body.m .mlist .slot.lose{box-shadow:inset 4px 0 0 var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:16px;z-index:30}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(440px,100%);max-height:84vh;overflow:auto}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px 12px;cursor:pointer;font:inherit;text-align:left}
.pitem:hover{border-color:var(--acc)}.pitem em{margin-left:auto;color:var(--mute);font-style:normal;font-size:11px}
@media(max-width:1100px){:root{--gap:62px;--col:212px}}
